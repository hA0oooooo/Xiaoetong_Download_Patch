name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt -c requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/native_bridge.test.cjs
      - run: python -m xiaoetong_assistant.app --smoke
